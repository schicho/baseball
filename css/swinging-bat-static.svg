<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- Motion Swish Arcs -->
  <path d="M10 4 A 18 18 0 0 1 28 19" fill="none" stroke="#90A4AE" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M6 7 A 22 22 0 0 1 25 24" fill="none" stroke="#B0BEC5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 3" opacity="0.6" />
  <path d="M14 2.5 A 15 15 0 0 1 29.5 14" fill="none" stroke="#78909C" stroke-width="1" stroke-linecap="round" opacity="0.5" />

  <!-- Ghost Trail Bat (Mid-Swing) -->
  <g transform="rotate(-55 22 23)" opacity="0.22">
    <path d="M20.5 23 L19.5 4 C19.5 1.8 24.5 1.8 24.5 4 L23.5 23 Z" fill="#C68642" />
  </g>

  <!-- Main Swinging Bat (Follow-Through Angle) -->
  <g transform="rotate(-18 22 23)">
    <!-- Bat Wood Body -->
    <path d="M20.5 23 L19.5 4 C19.5 1.8 24.5 1.8 24.5 4 L23.5 23 Z" fill="#C68642" stroke="#3E2723" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Wood Highlight -->
    <path d="M21.2 21 L20.8 4.5 C20.8 3.2 22.2 3.2 22.2 4.5 L22 21 Z" fill="#E0AC69" opacity="0.6" />
    <!-- Grip Tape -->
    <rect x="20.3" y="17" width="3.4" height="6" fill="#212121" stroke="#3E2723" stroke-width="0.8" />
    <path d="M20.3 18.5 L23.7 19.5 M20.3 20.5 L23.7 21.5" stroke="#616161" stroke-width="0.8" />
    <!-- Knob -->
    <rect x="19.5" y="23" width="5" height="2.2" rx="1.1" fill="#8D5524" stroke="#3E2723" stroke-width="1.2" />
  </g>
</svg>